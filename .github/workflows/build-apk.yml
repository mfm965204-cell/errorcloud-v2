name: Build Errorcloud APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  API_BASE: https://errorcloud-api.mfm965204.workers.dev
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Scaffold Android/iOS platform folders
        run: |
          set -euo pipefail
          flutter create --org com.errorcloud --project-name errorcloud \
            --platforms=android,ios --template=app .scaffold
          rm -rf android ios
          cp -r .scaffold/android ./android
          cp -r .scaffold/ios ./ios
          rm -rf .scaffold
          python3 tools/patch_android.py

      - name: Read TLS pin from the live API certificate
        id: pin
        run: |
          set -euo pipefail
          HOST="${API_BASE#https://}"
          HOST="${HOST%%/*}"
          PIN=$(echo | openssl s_client -connect "${HOST}:443" -servername "${HOST}" 2>/dev/null \
                 | openssl x509 -outform der \
                 | openssl dgst -sha256 -binary \
                 | base64 -w0)
          if [ -z "${PIN}" ]; then
            echo "Could not read the certificate pin for ${HOST}" >&2
            exit 1
          fi
          echo "Pinned SHA-256 for ${HOST}: ${PIN}"
          echo "pin=${PIN}" >> "$GITHUB_OUTPUT"
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE="${API_BASE}" \
            --dart-define=PINNED_SHA256="${{ steps.pin.outputs.pin }}"

      - name: Show artifact
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: errorcloud-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
