name: errorcloud
description: "Errorcloud — a zero-knowledge encrypted file vault. Developed by Error."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  file_picker: ^10.0.0
  file_saver: ^0.2.14
  http: ^1.2.2
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
